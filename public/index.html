<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080706">
<title>AI Bratishka — Creative Studio</title>
<style>
:root{--gold:#d9ad52;--gold2:#f3d68b;--bg:#080706;--panel:#100e0a;--line:#6f501e;--text:#f4f0e7;--muted:#b7aa91}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#241706 0,transparent 36%),var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.page{max-width:1024px;margin:auto;padding:0 0 34px}
.hero{position:relative;width:100%;line-height:0}
.hero>img{display:block;width:100%;height:auto}
.hotspots{position:absolute;inset:0;pointer-events:none}
.hotspot{position:absolute;pointer-events:auto;border:0;background:transparent;border-radius:5%;cursor:pointer}
.hotspot:focus-visible{outline:3px solid #ffe18a}
.hotspot.one{left:5.0%;top:73.0%;width:29.0%;height:24.5%}
.hotspot.two{left:35.7%;top:73.0%;width:29.0%;height:24.5%}
.hotspot.three{left:66.4%;top:73.0%;width:29.0%;height:24.5%}
.gallery{margin:-7px 3% 0;padding:0 2.2% 5px;border:2px solid #684a1b;border-top:0;border-radius:0 0 34px 34px;background:linear-gradient(180deg,#080706,#0b0906);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.template-card{position:relative;display:block;overflow:hidden;aspect-ratio:0.8;padding:0;border:2px solid #b8872d;border-radius:22px;background:#100e0a;cursor:pointer;min-width:0}
.template-card img{width:100%;height:100%;object-fit:cover;display:block}
.template-card span{position:absolute;left:8%;right:8%;bottom:9px;padding:6px 3px;border-radius:20px;background:rgba(0,0,0,.82);color:#fff0c7;font-weight:700;font-size:clamp(10px,2.6vw,18px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.template-card.selected{outline:3px solid #ffe08a;outline-offset:1px}
.studio{margin:20px 3% 0;padding:20px;border:2px solid var(--gold);border-radius:30px;background:linear-gradient(145deg,#17130c,#090807);box-shadow:0 0 25px rgba(220,160,45,.15)}
.studio h2{margin:0 0 16px;color:var(--gold2);font-size:clamp(20px,4vw,30px);letter-spacing:1px}
.studio-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.upload{min-height:230px;border:2px dashed #b8872d;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:15px;color:var(--muted);cursor:pointer}
.upload strong{color:var(--gold2);font-size:20px;margin:8px 0}
.upload input{display:none}
.preview{display:none;max-width:100%;max-height:220px;margin-top:12px;border-radius:12px;object-fit:contain}
.right{display:flex;flex-direction:column;gap:12px}
.prompt{width:100%;min-height:110px;background:#080706;border:1px solid #75531f;color:white;border-radius:16px;padding:14px;font:inherit;font-size:15px;resize:vertical;outline:none}
.prompt:focus{border-color:var(--gold2)}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.mode{border:1px solid #75531f;border-radius:22px;padding:9px 13px;background:#090807;color:#e4d0a6;font-size:13px;cursor:pointer}
.mode.active{background:#3a2a10;border-color:var(--gold2);color:#ffe49b}
.create{width:100%;border:0;border-radius:28px;padding:16px;background:linear-gradient(110deg,#b88932,#f5d477,#b88932);color:#171008;font-weight:900;font-size:20px;cursor:pointer}
.status{min-height:20px;color:var(--gold2);font-size:13px}
.note{color:#9e927d;font-size:12px;line-height:1.5;margin:0}
.bottom-nav{position:sticky;bottom:8px;z-index:5;margin:22px 3% 0;padding:10px 4px;border:2px solid var(--gold);border-radius:36px;background:rgba(8,8,7,.94);backdrop-filter:blur(12px);display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 0 20px rgba(220,160,45,.15)}
.bottom-nav a{color:#eee8da;text-decoration:none;text-align:center;font-size:12px;padding:4px 0}
.bottom-nav a:first-child{color:var(--gold2)}
.bottom-nav b{display:block;font-size:25px;line-height:1.2;margin-bottom:3px}
@media(max-width:640px){
 .grid{gap:12px}
 .template-card{border-radius:15px;border-width:1.5px}
 .template-card span{bottom:6px;padding:5px 2px}
 .studio{padding:14px;border-radius:22px}
 .studio-layout{grid-template-columns:1fr}
 .upload{min-height:160px}
 .prompt{min-height:95px}
}
</style>
</head>
<body>
<main class="page">
  <!-- Исходный утверждённый макет показывается без изменений -->
  <section class="hero" id="home" aria-label="Главный экран AI Bratishka">

      <button class="hotspot two" type="button" data-prompt="Футуристичный фантастический портрет с золотыми деталями" aria-label="Шаблон Фантастика"></button>
      <button class="hotspot three" type="button" data-prompt="Эпичная сцена с героем на фоне огромной луны" aria-label="Шаблон Эпичный стиль"></button>

  <section class="studio" id="studio">
    <h2>✦ AI ФОТОСТУДИЯ</h2>
    <div class="studio-layout">
      <label class="upload" for="photo">
        <span style="font-size:42px;color:#f3d68b">⇧</span>
        <strong>Загрузите фото</strong>
        <span>Выберите изображение на устройстве</span>
        <input id="photo" type="file" accept="image/*">
        <img id="preview" class="preview" alt="Предпросмотр фотографии">
      </label>
      <div class="right">
        <textarea id="prompt" class="prompt" placeholder="Например: замени фон на роскошный ночной город, сохрани лицо и одежду..."></textarea>
        <div class="modes">
          <button class="mode active" type="button">Фото</button>
          <button class="mode" type="button">Редактирование</button>
          <button class="mode" type="button">Стиль</button>
        </div>
        <button class="create" id="create" type="button">Создать ✦</button>
        <div class="status" id="status" aria-live="polite"></div>
        <p class="note">Интерфейс подготовлен. Подключение генерации будет отдельным следующим этапом.</p>
      </div>
    </div>
  </section>

  <nav class="bottom-nav" aria-label="Нижняя навигация">
    <a href="#home"><b>⌂</b>Главная</a>
    <a href="#templates"><b>▦</b>Шаблоны</a>
    <a href="#studio"><b>◷</b>История</a>
    <a href="#studio"><b>☆</b>Профиль</a>
  </nav>
</main>
<script>
const promptBox=document.getElementById('prompt');
const statusBox=document.getElementById('status');
document.querySelectorAll('[data-prompt]').forEach(card=>{
  card.addEventListener('click',()=>{
    promptBox.value=card.dataset.prompt;
    document.querySelectorAll('.template-card').forEach(x=>x.classList.remove('selected'));
    if(card.classList.contains('template-card')) card.classList.add('selected');
    statusBox.textContent='Шаблон выбран. Описание добавлено в фотостудию.';
    document.getElementById('studio').scrollIntoView({behavior:'smooth',block:'start'});
  });
});
document.querySelectorAll('.mode').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
  });
});
const photo=document.getElementById('photo');
const preview=document.getElementById('preview');
photo.addEventListener('change',()=>{
  const file=photo.files&&photo.files[0];
  if(!file)return;
  preview.src=URL.createObjectURL(file);
  preview.style.display='block';
  statusBox.textContent='Фото выбрано.';
});
document.getElementById('create').addEventListener('click',()=>{
  statusBox.textContent=photo.files.length
    ?'Фото и описание готовы. Генерация будет подключена следующим этапом.'
    :'Сначала загрузите фотографию.';
});
</script>
